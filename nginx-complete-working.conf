server {
    listen 80;
    listen 443 ssl;
    server_name mymedspharmacyinc.com www.mymedspharmacyinc.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/mymedspharmacyinc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mymedspharmacyinc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Increase client body size for WooCommerce product uploads
    client_max_body_size 64M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # PHP-FPM configuration
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    # Backend API proxy - MUST come first to avoid conflicts
    location /api {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # WordPress uploads/media - CRITICAL for media to load
    location ~ ^/wp/wp-content/uploads/ {
        alias /var/www/wordpress/wp-content/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # WordPress static assets (CSS, JS, fonts, images in themes/plugins)
    location ~ ^/wp/wp-content/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|webp|map)$ {
        alias /var/www/wordpress/wp-content/;
        rewrite ^/wp/wp-content/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # WordPress wp-includes static files
    location ~ ^/wp/wp-includes/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|webp)$ {
        alias /var/www/wordpress/wp-includes/;
        rewrite ^/wp/wp-includes/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # WordPress admin area
    location ~ ^/wp/wp-admin {
        alias /var/www/wordpress/wp-admin;
        index index.php;
        
        # Try to serve file directly, fallback to index.php
        try_files $uri $uri/ /wp/wp-admin/index.php?$args;

        # Handle PHP files in wp-admin
        location ~ \.php$ {
            # Remove /wp prefix and set correct path
            rewrite ^/wp/wp-admin/(.*)$ /wp-admin/$1 break;
            
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/wordpress$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $https if_not_empty;
        }
    }

    # WordPress login page
    location ~ ^/wp/wp-login\.php$ {
        root /var/www/wordpress;
        
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/wordpress/wp-login.php;
        include fastcgi_params;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }

    # WordPress AJAX handler
    location ~ ^/wp/wp-admin/admin-ajax\.php$ {
        root /var/www/wordpress;
        
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/wordpress/wp-admin/admin-ajax.php;
        include fastcgi_params;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }

    # WordPress CRON
    location ~ ^/wp/wp-cron\.php$ {
        root /var/www/wordpress;
        
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/wordpress/wp-cron.php;
        include fastcgi_params;
    }

    # WooCommerce specific - handle AJAX and API endpoints
    location ~ ^/wp/\?wc-ajax= {
        alias /var/www/wordpress/;
        try_files $uri /wp/index.php?$args;
        
        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/wordpress/index.php;
            include fastcgi_params;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
        }
    }

    # WordPress REST API and WP JSON
    location ~ ^/wp/(wp-json|index\.php) {
        root /var/www/wordpress;
        try_files $uri $uri/ /index.php?$args;

        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/wordpress$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }

    # WordPress xmlrpc (needed for some plugins)
    location ~ ^/wp/xmlrpc\.php$ {
        root /var/www/wordpress;
        
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/wordpress/xmlrpc.php;
        include fastcgi_params;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }

    # Main WordPress location block
    location /wp/ {
        alias /var/www/wordpress/;
        index index.php;
        
        # WordPress permalinks
        try_files $uri $uri/ /wp/index.php?$args;

        # Handle all PHP files in WordPress
        location ~ \.php$ {
            # Remove /wp prefix for actual file path
            rewrite ^/wp/(.*)$ /$1 break;
            
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/wordpress$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param PATH_INFO $fastcgi_path_info if_not_empty;
            fastcgi_param HTTPS $https if_not_empty;
        }
    }

    # React app static assets - Specific extensions to avoid conflicts
    location ~* ^/(?!wp/|api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|webp|map|json)$ {
        root /var/www/mymeds-brooklyn-care-1/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # React app manifest and service worker
    location ~ ^/(manifest\.json|sw\.js|robots\.txt|favicon\.ico)$ {
        root /var/www/mymeds-brooklyn-care-1/dist;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # React Frontend (SPA) - catch all for app routes
    location / {
        root /var/www/mymeds-brooklyn-care-1/dist;
        try_files $uri $uri/ /index.html;
        index index.html;
        
        # Ensure HTML is never cached
        location ~ \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }

    # Security - deny access to sensitive files
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ /\.(env|log|git|svn|htaccess|htpasswd)$ {
        deny all;
    }

    # Deny access to WordPress config and sensitive files
    location ~ /wp-config\.php$ {
        deny all;
    }

    location ~ /readme\.html$ {
        deny all;
    }

    location ~ /license\.txt$ {
        deny all;
    }

    # PHP execution security - deny in uploads
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }
}

