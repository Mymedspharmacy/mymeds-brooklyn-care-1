# =============================================================================
# WORDPRESS NGINX CONFIGURATION - MyMeds Pharmacy Inc.
# =============================================================================
# WordPress-specific nginx configuration for the WordPress container
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # =============================================================================
    # WORDPRESS CORE ROUTES
    # =============================================================================
    
    # WordPress admin
    location /wp-admin/ {
        try_files $uri $uri/ /wp-admin/index.php?$args;
    }

    # WordPress login
    location /wp-login.php {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # WordPress core files
    location ~ ^/wp-(admin|includes|content) {
        try_files $uri $uri/ /index.php?$args;
    }

    # WordPress REST API
    location /wp-json/ {
        try_files $uri $uri/ /index.php?$args;
    }

    # =============================================================================
    # WOOCOMMERCE ROUTES
    # =============================================================================
    
    # WooCommerce shop
    location /shop/ {
        try_files $uri $uri/ /index.php?$args;
    }

    # WooCommerce cart and checkout
    location ~ ^/(cart|checkout|my-account|wc-api)/ {
        try_files $uri $uri/ /index.php?$args;
    }

    # =============================================================================
    # PHP PROCESSING
    # =============================================================================
    
    # PHP files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # WordPress specific parameters
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
    }

    # =============================================================================
    # STATIC FILES & CACHING
    # =============================================================================
    
    # Static files with caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # WordPress uploads
    location /wp-content/uploads/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # =============================================================================
    # SECURITY
    # =============================================================================
    
    # Block access to sensitive files
    location ~ /\.ht {
        deny all;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to wp-config.php
    location ~ /wp-config\.php {
        deny all;
    }

    # Block access to readme and license files
    location ~* /(readme|license|changelog|upgrading)\.txt$ {
        deny all;
    }

    # =============================================================================
    # WORDPRESS PERMALINKS
    # =============================================================================
    
    # WordPress pretty permalinks
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # =============================================================================
    # ERROR HANDLING
    # =============================================================================
    
    error_page 404 /index.php;
}
